services:
  # PostgreSQL database als backend voor MLFlow
  database:
    build: ./services/database
    restart: unless-stopped
    env_file:
      - ./services/database/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MLFlow tracking server bereikbaar op http://localhost:5000
  experiment-tracking:
    build: ./services/experiment-tracking
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  # Prefect orchestration server bereikbaar op http://localhost:4200
  orchestration:
    build: ./services/orchestration
    ports:
      - "4200:4200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Web service: REST API voor on-demand voorspellingen bereikbaar op http://localhost:9696
  web-service:
    build:
      context: .
      dockerfile: ./services/web-service/Dockerfile
    ports:
      - "9696:9696"
    depends_on:
      experiment-tracking:
        condition: service_started
    environment:
      - MLFLOW_TRACKING_URI=http://experiment-tracking:5000
    restart: unless-stopped

  # Training pipeline
  train:
    build:
      context: .
      dockerfile: ./services/train/Dockerfile
    depends_on:
      experiment-tracking:
        condition: service_started
      orchestration:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://experiment-tracking:5000
      - PREFECT_API_URL=http://orchestration:4200/api

volumes:
  postgres-data:
