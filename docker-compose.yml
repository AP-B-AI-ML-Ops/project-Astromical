services:
  # PostgreSQL database als backend voor MLFlow
  database:
    build: ./services/database
    restart: unless-stopped
    env_file:
      - ./services/database/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MLFlow tracking server bereikbaar op http://localhost:5000
  experiment-tracking:
    build: ./services/experiment-tracking
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - mlruns-data:/mlruns
    restart: unless-stopped

  # Prefect orchestration server bereikbaar op http://localhost:4200
  orchestration:
    build: ./services/orchestration
    ports:
      - "4200:4200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Web service: REST API voor voorspellingen bereikbaar op http://localhost:9696
  web-service:
    build:
      context: .
      dockerfile: ./services/web-service/Dockerfile
    ports:
      - "9696:9696"
    depends_on:
      experiment-tracking:
        condition: service_started
    environment:
      - MLFLOW_TRACKING_URI=http://experiment-tracking:5000
    restart: unless-stopped

  # Batch service ook beschikbaar op http://localhost:4200
  batch-service:
    build:
      context: .
      dockerfile: ./services/batch-service/Dockerfile
    depends_on:
      experiment-tracking:
        condition: service_started
      orchestration:
        condition: service_healthy
      database:
        condition: service_healthy
      train:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://experiment-tracking:5000
      - PREFECT_API_URL=http://orchestration:4200/api
      - DATABASE_URL=postgresql://postgres:postgres@database:5432/postgres
    volumes:
      - batch-data:/batch-data
    restart: unless-stopped

  # Grafana dashboard bereikbaar op http://localhost:3000
  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./services/grafana/dashboards:/opt/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # Evidently UI bereikbaar op http://localhost:8000
  evidently-ui:
    image: python:3.11-slim
    command: bash -c "pip install evidently==0.4.36 -q && evidently ui --workspace /batch-data/evidently --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    volumes:
      - batch-data:/batch-data
    restart: unless-stopped

  # Training pipeline
  train:
    build:
      context: .
      dockerfile: ./services/train/Dockerfile
    depends_on:
      experiment-tracking:
        condition: service_started
      orchestration:
        condition: service_healthy
    environment:
      - MLFLOW_TRACKING_URI=http://experiment-tracking:5000
      - PREFECT_API_URL=http://orchestration:4200/api
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request, json; data = json.loads(urllib.request.urlopen('http://experiment-tracking:5000/api/2.0/mlflow/registered-models/search').read()); exit(0 if data.get('registered_models') else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  postgres-data:
  batch-data:
  grafana-data:
  mlruns-data:
  pgadmin-data:
