services:
  # PostgreSQL database als backend voor MLFlow
  database:
    build: ./services/database
    restart: unless-stopped
    env_file:
      - ./services/database/.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MLFlow tracking server bereikbaar op http://localhost:5000
  experiment-tracking:
    build: ./services/experiment-tracking
    ports:
      - "5000:5000"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  # Training pipeline
  train:
    build:
      context: .
      dockerfile: ./services/train/Dockerfile
    depends_on:
      experiment-tracking:
        condition: service_started
    environment:
      - MLFLOW_TRACKING_URI=http://experiment-tracking:5000

volumes:
  postgres-data:
