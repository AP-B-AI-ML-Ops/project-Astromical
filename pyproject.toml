[tool.black]
line-length = 88

[tool.isort]
# zorgt ervoor dat isort hetzelfde styling heeft als black
profile = "black"

[tool.pylint.messages_control]
# dit maakt de docstring niet verplicht
disable = [
    "missing-function-docstring",
    "missing-class-docstring",
    "import-error",
    "no-name-in-module"
]

[tool.pylint.format]
max-line-length = 120

[tool.pytest.ini_options]
# Voegt de projectroot toe aan het Python pad zodat lokale modules importeerbaar zijn
pythonpath = ["."]
# Geeft aan waar pytest de testbestanden moet zoeken
testpaths = ["tests"]
